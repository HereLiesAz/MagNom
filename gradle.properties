# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Compose Multiplatform resources
org.jetbrains.compose.experimental.uikit.enabled=false

# AGP 9 ships built-in Kotlin; disable it so the Kotlin Multiplatform plugin owns the `kotlin` extension.
android.builtInKotlin=false

# KMP androidTarget() is not yet compatible with AGP 9 new DSL; use the documented bypass.
android.newDsl=false
